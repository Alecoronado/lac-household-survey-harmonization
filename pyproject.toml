[project]
name = "lacharm"
version = "0.1.0"
description = "LLM-assisted harmonization of Latin American household surveys, with automated QC and design-based poverty indicators."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alessandro Coronado" }]
# Runtime dependencies are added in the phase that first needs them,
# so every dependency in this list is actually used by the code.
dependencies = [
    "polars>=2.1.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
lacharm = "lacharm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacharm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # import sorting
    "B",  # bugbear: likely bugs
    "UP", # modern Python idioms
    "SIM", # simplifications
]
