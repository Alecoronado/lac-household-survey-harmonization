name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked

      # CI never touches microdata: tests run on small hand-written fixtures only.
      - name: Lint
        run: make lint

      - name: Test
        run: make test
